[project]
name = "ott-content-aggregator-api"
version = "1.0.0"
description = "High-performance asynchronous OTT Content Aggregator API built with FastAPI, PostgreSQL, Redis and SQLAlchemy."
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "passlib[bcrypt]>=1.7.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
]

dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
    "alembic>=1.12.0",
    "pydantic-settings>=2.2.0",
]

[tool.black]
line-length = 88
target-version = ["python-3.12"]

[tool.flake8]
select = "E,F,W"
max-line-length = 88

[tool.mypy]
python_version = "3.12"
disallow_untyped_definitions = false

[tool.isort]
profile = "black"