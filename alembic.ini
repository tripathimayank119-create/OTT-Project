[alembic]
script_location = migrations
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost/ott_aggregator

# Logging configuration
[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.1s [%(name)s][%(filename)s:%(funcname)s:%(lineno)d] %(message)s

[logger_root]
level = WARN
handlers = console